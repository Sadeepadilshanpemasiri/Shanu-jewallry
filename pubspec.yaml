name: jewellery_business_manager
description: Mobile-first workspace for the owner of a Sri Lankan jewellery business.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  barcode_widget: ^2.0.4
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  fl_chart: 0.71.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  mobile_scanner: ^7.5.0
  pdf: ^3.11.3
  printing: ^5.14.3
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0+1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true